name: Feature request
description: Propose a diagnostic, integration, output mode, or workflow improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Operator problem
      description: Which server administration problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired output or behavior, not only implementation.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example diagnostic
      description: Show an example when the request changes console output.
      render: text
  - type: textarea
    id: evidence
    attributes:
      label: Classification evidence
      description: How can Stackframe detect this case without guessing?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: constraints
    attributes:
      label: Safety constraints
      options:
        - label: The original failure remains available if formatting fails.
          required: true
        - label: Plain-text output can convey the same meaning.
          required: true
        - label: I searched for an existing issue.
          required: true
