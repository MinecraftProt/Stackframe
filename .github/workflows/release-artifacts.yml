name: Release artifacts

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build tagged artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      bundle_name: ${{ steps.tag.outputs.bundle_name }}

    steps:
      - name: Check out tagged source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: '3.13'

      - name: Validate annotated release tag
        id: tag
        run: python3 scripts/release/release.py validate --tag "$GITHUB_REF_NAME" --github-output "$GITHUB_OUTPUT"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          validate-wrappers: false

      - name: Build and verify tagged source
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
          SOURCE_COMMIT: ${{ steps.tag.outputs.commit }}
        run: |
          ./gradlew --no-daemon --stacktrace --dependency-verification=strict \
            -PreleaseVersion="$RELEASE_VERSION" -PreleaseSourceRevision="$SOURCE_COMMIT" \
            clean build verifyModuleBoundaries

      - name: Record resolved runtime dependencies
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
          SOURCE_COMMIT: ${{ steps.tag.outputs.commit }}
        run: |
          mkdir -p build/release
          ./gradlew --no-daemon --dependency-verification=strict --console=plain \
            -PreleaseVersion="$RELEASE_VERSION" -PreleaseSourceRevision="$SOURCE_COMMIT" \
            :stackframe-fabric:dependencies --configuration runtimeClasspath \
            > build/release/runtime-dependencies.txt

      - name: Assemble release evidence
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
          SOURCE_COMMIT: ${{ steps.tag.outputs.commit }}
        run: python3 scripts/release/release.py assemble --tag "$GITHUB_REF_NAME" --version "$RELEASE_VERSION" --commit "$SOURCE_COMMIT"

      - name: Upload immutable run bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.tag.outputs.bundle_name }}
          path: build/release/staging/
          if-no-files-found: error
          overwrite: false
          retention-days: 90

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failed-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            **/build/reports/dependency-verification/**
            **/build/reports/problems/**
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore
          overwrite: false
          retention-days: 7

  attest:
    name: Attest tagged Fabric JAR
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download exact run bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: ${{ needs.build.outputs.bundle_name }}
          path: release

      - name: Verify downloaded checksums
        run: cd release && sha256sum --check SHA256SUMS

      - name: Attest downloadable binary
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.0.0
        with:
          subject-path: release/stackframe-fabric-*.jar
