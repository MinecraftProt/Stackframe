# Authoritative foundation baseline. Build configuration introduced by issue #7
# must consume these pins rather than redeclaring them independently.
[versions]
java = "25"
minecraft = "26.2"
fabric-loader = "0.19.3"
fabric-api = "0.158.0+26.2"
fabric-loom = "1.17.20"
gradle = "9.5.1"

[libraries]
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }

[plugins]
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "fabric-loom" }
